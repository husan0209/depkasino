name: Проверка

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

jobs:
  verify:
    name: Типы, линт, сборка, приёмка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Линт
        run: npm run lint

      - name: Прод-сборка
        run: npm run build

      # Приёмка ходит по реальному серверу: поднимаем прод-сборку и ждём ответа.
      - name: Приёмка (Часть 5 + 5.1)
        run: |
          npm start &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000 && break
            sleep 1
          done
          npm run acceptance
